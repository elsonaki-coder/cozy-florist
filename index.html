<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 코지 플로리스트 정원산책길드 소유꽃확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#4caf50;--green-light:#e8f5e9;--green-mid:#a5d6a7;
    --blue:#1976d2;--blue-light:#e3f2fd;--blue-mid:#90caf9;
    --purple:#6a1b9a;--purple-light:#f3e5f5;--purple-mid:#ce93d8;
    --yellow:#f57f17;--yellow-light:#fffde7;--yellow-mid:#fff176;
    --red:#b71c1c;--red-light:#fce4ec;--red-mid:#f48fb1;
    --bg:#faf9f7;--card:#fff;--border:#e8e4df;--border2:#d4cfc9;
    --text:#2c2825;--text2:#6b6560;--text3:#9e9890;
    --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  }
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  
  /* LOGIN */
  #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1.5rem;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1.2rem;align-items:center;}
  .login-emoji{font-size:48px;}
  .login-title{font-size:20px;font-weight:700;color:var(--text);}
  .login-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;}
  .login-input{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .2s;}
  .login-input:focus{border-color:var(--green);}
  .login-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;}
  .login-btn:hover{background:#388e3c;}
  .login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6;}

  /* APP */
  #app-screen{display:none;flex-direction:column;min-height:100vh;}
  
  /* HEADER */
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
  .header-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.3;}
  .header-credit{font-size:10px;font-weight:400;color:var(--text3);margin-left:2px;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .nick-badge{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
  .logout-btn{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{color:var(--text);}

  /* TABS */
  .tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 1rem;}
  .tab{padding:12px 14px;font-size:14px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:all .15s;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  /* CONTENT */
  .content{flex:1;padding:1rem;}

  /* FILTERS */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}
  .search-wrap{position:relative;flex:1;min-width:140px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);}
  .search-input{width:100%;padding:9px 10px 9px 34px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .search-input:focus{border-color:var(--green);}
  .filter-select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .sort-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .sort-pill{padding:6px 11px;border-radius:20px;font-size:12px;font-family:inherit;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;}
  .sort-pill.active{background:var(--green-light);border-color:var(--green-mid);color:#2e7d32;font-weight:500;}

  /* FLOWER LIST */
  .flower-list{display:flex;flex-direction:column;gap:6px;}
  .flower-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
  .flower-row:active{transform:scale(.98);}
  .flower-row.selected{background:var(--green-light);border-color:var(--green-mid);}
  .grade-badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .grade-N{background:var(--green-light);color:#2e7d32;border:1px solid var(--green-mid);}
  .grade-R{background:var(--blue-light);color:#1565c0;border:1px solid var(--blue-mid);}
  .grade-SR{background:var(--purple-light);color:#4a148c;border:1px solid var(--purple-mid);}
  .grade-SSR{background:var(--yellow-light);color:#e65100;border:1px solid var(--yellow-mid);}
  .grade-UR{background:var(--red-light);color:#b71c1c;border:1px solid var(--red-mid);}
  .flower-name{font-size:14px;flex:1;color:var(--text);}
  .flower-cond{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
  .check-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .check-icon.on{background:var(--green);color:#fff;}
  .check-icon.off{background:var(--border);color:transparent;}

  /* GUILD VIEW */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
  .stat-num{font-size:22px;font-weight:700;color:var(--text);}
  .stat-num.warn{color:#e53935;}
  .stat-num.ok{color:#43a047;}
  .stat-label{font-size:11px;color:var(--text2);margin-top:2px;}
  .guild-row{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);}
  .guild-row.unowned{border-color:#ef9a9a;background:#fff8f8;}
  .guild-row-top{display:flex;align-items:center;gap:8px;}
  .unowned-badge{font-size:10px;background:var(--red-light);color:#c62828;border-radius:8px;padding:2px 7px;border:1px solid var(--red-mid);flex-shrink:0;}
  .owner-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .owner-chip{font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:2px 8px;color:var(--text2);}

  /* ADMIN */
  .admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .section-title{font-size:14px;font-weight:700;margin-bottom:1rem;color:var(--text);}
  .admin-input-row{display:flex;gap:8px;margin-bottom:1rem;}
  .admin-input{flex:1;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
  .admin-input:focus{border-color:var(--green);}
  .admin-btn{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .admin-btn:hover{background:var(--border);}
  .admin-btn.danger{border-color:#ef9a9a;color:#c62828;background:var(--red-light);}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:#fff;}
  .blocked-row{border-color:#ef9a9a;background:var(--red-light);}
  .member-name{flex:1;font-size:14px;}
  .member-count{font-size:12px;color:var(--text2);}

  /* 닉네임 인라인 편집 */
  .member-edit-row{display:flex;align-items:center;gap:6px;flex:1;}
  .member-nick-input{flex:1;padding:5px 9px;border:1.5px solid var(--green-mid);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .member-nick-input:focus{border-color:var(--green);}
  .member-save-btn{padding:5px 12px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .member-save-btn:hover{background:#388e3c;}
  .member-cancel-btn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;font-family:inherit;cursor:pointer;}
  .rename-btn{font-size:12px;color:#1565c0;border:1px solid var(--blue-mid);border-radius:8px;padding:3px 10px;cursor:pointer;background:var(--blue-light);font-family:inherit;}
  .rename-btn:hover{background:var(--blue-mid);color:#fff;}
  .blocked-tag{font-size:11px;background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:2px 8px;}
  .unblock-btn{font-size:12px;color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:3px 10px;cursor:pointer;background:transparent;font-family:inherit;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* EMPTY */
  .empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px;}

  /* 헤더 로그인 영역 */
  .login-inline{display:flex;align-items:center;gap:6px;}
  .login-inline-input{padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100px;}
  .login-inline-input:focus{border-color:var(--green);}
  .login-inline-btn{padding:5px 12px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .login-inline-btn:hover{background:#388e3c;}

  /* 읽기전용 배너 */
  .readonly-banner{display:none;background:#fff3e0;border-bottom:1px solid #ffcc80;padding:7px 1rem;font-size:12px;color:#e65100;font-weight:500;text-align:center;}
  .readonly-banner.on{display:block;}

  /* 긴급버튼 */
  .danger-section{background:#fff5f5;border:1.5px solid #ef9a9a;border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .danger-section-title{font-size:14px;font-weight:700;color:#c62828;margin-bottom:.6rem;}
  .readonly-toggle-btn{width:100%;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all .2s;}
  .readonly-toggle-btn.enable{background:#e53935;color:#fff;}
  .readonly-toggle-btn.enable:hover{background:#c62828;}
  .readonly-toggle-btn.disable{background:#43a047;color:#fff;}
  .readonly-toggle-btn.disable:hover{background:#2e7d32;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}

  /* SAVE BAR */
  .save-bar{background:var(--green-light);border-bottom:1px solid var(--green-mid);padding:6px 1rem;font-size:12px;color:#2e7d32;text-align:center;font-weight:500;}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .modal{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:1.2rem;color:var(--text);}
  .modal-field{display:flex;flex-direction:column;gap:5px;margin-bottom:.9rem;}
  .modal-label{font-size:12px;font-weight:500;color:var(--text2);}
  .modal-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100%;}
  .modal-input:focus{border-color:var(--green);}
  .modal-row{display:flex;gap:8px;margin-top:.4rem;}
  .modal-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;}
  .modal-btn.primary{background:var(--green);color:#fff;}
  .modal-btn.primary:hover{background:#388e3c;}
  .modal-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border2);}
  .modal-btn.secondary:hover{background:var(--border);}
  .modal-btn.danger-btn{background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);}

  /* CUSTOM FLOWER BADGE */
  .custom-tag{font-size:10px;background:#fff8e1;color:#e65100;border:1px solid #ffcc02;border-radius:8px;padding:1px 6px;flex-shrink:0;}
  .flower-actions{display:flex;gap:4px;flex-shrink:0;}
  .flower-action-btn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .flower-action-btn:hover{background:var(--border);}
  .flower-action-btn.del{border-color:var(--red-mid);color:#c62828;background:var(--red-light);}

  /* ADD BUTTON */
  .add-flower-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;margin-bottom:1rem;}
  .add-flower-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light);}

  @media(max-width:400px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .flower-cond{display:none;}
  }



  /* ── 이벤트 페이지 ── */
  .event-page{
    position:relative;min-height:calc(100vh - 110px);overflow:hidden;
    background:
      radial-gradient(circle at 15% 15%,rgba(255,255,255,.95) 0 3px,transparent 4px),
      radial-gradient(circle at 80% 25%,rgba(255,255,255,.8) 0 2px,transparent 3px),
      linear-gradient(180deg,#dff7ec 0%,#f8f2df 46%,#d8efd0 100%);
    padding:20px 14px 40px;
  }
  .event-page::before,.event-page::after{
    position:absolute;content:"🌸 🌼 🌷 🌻 🌺 🌹 🌿 🌸 🌼 🌷";
    font-size:34px;letter-spacing:10px;line-height:1.3;opacity:.8;pointer-events:none;
    white-space:nowrap;
  }
  .event-page::before{top:2px;left:-18px;transform:rotate(-4deg);}
  .event-page::after{bottom:0;right:-24px;transform:rotate(3deg);}
  .event-clock{
    position:absolute;right:18px;top:14px;z-index:5;
    background:rgba(255,255,255,.88);border:2px solid rgba(118,165,111,.3);
    border-radius:999px;padding:8px 14px;box-shadow:0 5px 16px rgba(80,110,70,.14);
    color:#456047;font-size:13px;font-weight:700;letter-spacing:.2px;
  }
  .event-title{text-align:center;position:relative;z-index:2;padding:18px 0 12px;}
  .event-title-main{
    font-family:"Comic Sans MS","Nanum Pen Script","Noto Sans KR",cursive;
    font-size:clamp(28px,5vw,48px);font-weight:700;color:#5b704e;
    text-shadow:0 3px 0 rgba(255,255,255,.9);
  }
  .event-title-sub{font-size:12px;color:#75866d;margin-top:4px;}
  .event-board-wrap{
    position:relative;z-index:2;max-width:1050px;margin:10px auto 0;
    padding:18px;border-radius:32px;
    background:linear-gradient(145deg,#fffaf0,#d7ead0);
    border:8px solid #a87955;
    box-shadow:0 14px 0 #7d5b45,0 22px 40px rgba(65,80,55,.2);
  }
  .event-board{
    min-height:430px;border-radius:20px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 50% 20%,rgba(255,255,255,.12),transparent 35%),
      linear-gradient(180deg,#293c50,#182536 65%,#111b27);
    border:8px solid #516578;box-shadow:inset 0 0 50px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .event-board::before{
    content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.18);
    border-radius:14px;pointer-events:none;
  }
  .event-flower-corner{position:absolute;font-size:48px;z-index:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));}
  .event-flower-corner.tl{top:10px;left:16px}.event-flower-corner.tr{top:10px;right:16px}
  .event-flower-corner.bl{bottom:8px;left:16px}.event-flower-corner.br{bottom:8px;right:16px}
  .event-screen{width:100%;max-width:850px;text-align:center;position:relative;z-index:2;}
  .event-gift-label{
    font-family:"Nanum Pen Script","Comic Sans MS","Noto Sans KR",cursive;
    font-size:clamp(25px,4vw,42px);font-weight:700;color:#ffeaa7;
    text-shadow:0 2px 10px rgba(255,220,120,.35);min-height:48px;
  }
  .event-countdown{font-size:14px;color:#b9d5c2;margin:4px 0 16px;min-height:20px;}
  .event-name-window{
    position:relative;overflow:hidden;min-height:150px;display:flex;align-items:center;justify-content:center;
    border-radius:24px;padding:15px 20px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.18));
    border:2px solid rgba(255,255,255,.15);
  }
  .event-name{
    font-family:"Nanum Pen Script","Comic Sans MS","Noto Sans KR",cursive;
    font-size:clamp(54px,10vw,105px);font-weight:700;color:#fff;
    text-shadow:0 5px 0 rgba(74,50,35,.35),0 0 25px rgba(255,235,170,.45);
    word-break:keep-all;transition:transform .2s;
  }
  .event-name.spinning{animation:eventJitter .08s infinite alternate;}
  @keyframes eventJitter{from{transform:translateY(-2px) rotate(-1deg)}to{transform:translateY(2px) rotate(1deg)}}
  .event-name.winner{animation:eventWinner .9s ease-out both;}
  @keyframes eventWinner{0%{transform:scale(.35);opacity:.1}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  .event-status{font-size:13px;color:#c9dfce;margin-top:12px;min-height:20px;}
  .event-fireworks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8;}
  .firework{position:absolute;font-size:42px;animation:fw 1.8s ease-out forwards;}
  @keyframes fw{0%{transform:scale(.2);opacity:0}20%{opacity:1}100%{transform:scale(1.8) translateY(-30px);opacity:0}}
  .event-result{
    position:relative;z-index:3;max-width:1050px;margin:22px auto 0;padding:18px;
    border-radius:24px;background:rgba(255,255,255,.9);border:2px solid #c5dbbb;
    box-shadow:0 7px 20px rgba(70,100,60,.12);
  }
  .event-result-title{text-align:center;font-family:"Nanum Pen Script","Comic Sans MS","Noto Sans KR",cursive;font-size:31px;color:#5b704e;font-weight:700;}
  .event-result-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px;}
  .event-result-card{padding:13px 15px;border-radius:16px;background:#fffaf0;border:1px solid #e7d9bf;text-align:center;}
  .event-result-gift{font-size:12px;color:#9b7b52;margin-bottom:3px;font-weight:700;}
  .event-result-name{font-family:"Nanum Pen Script","Noto Sans KR",cursive;font-size:28px;color:#465c46;font-weight:700;}
  .event-admin{
    position:relative;z-index:3;max-width:1050px;margin:18px auto 0;padding:18px;
    background:rgba(255,255,255,.95);border:2px solid #c5dbbb;border-radius:22px;
  }
  .event-admin h3{font-size:16px;color:#50644d;margin-bottom:12px;}
  .event-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .event-admin-field{display:flex;flex-direction:column;gap:5px;}
  .event-admin-field.full{grid-column:1/-1;}
  .event-admin-label{font-size:12px;color:#6f7e69;font-weight:700;}
  .event-admin-input,.event-admin-textarea{
    width:100%;padding:10px 11px;border:1px solid #cddac7;border-radius:10px;
    font-family:inherit;background:#fff;outline:none;
  }
  .event-admin-textarea{min-height:100px;resize:vertical;line-height:1.5;}

// ── Firebase 구독 ──────────────────────────────────────────
let readOnly = false;  // Firebase에서 읽어온 읽기전용 상태

function subscribeDB() {
  if (unsub) unsub();
  const r = ref(db, "/");
  unsub = onValue(r, snap => {
    const data = snap.val() || {};
    selections = data.selections || {};
    blocked = data.blocked || [];
    members = data.members || {};
    readOnly = data.readOnly === true;
    eventData = data.event || null;

    // 커스텀 꽃 로드
    const raw = data.customFlowers || {};
    customFlowers = Object.entries(raw).map(([fbKey, v]) => {
      const safeId = ("c_" + fbKey).replace(/[.#$\/\[\]]/g,"_");
      return { fbKey, id: safeId, grade: v.grade, cond: v.cond, name: v.name, addedBy: v.addedBy || "", addedAt: v.addedAt || null };
    });

    // 삭제된 기본 꽃 id 로드
    const delRaw = data.deletedFlowers || {};
    deletedFlowerIds = new Set(Object.keys(delRaw).map(k => Number(k)));

    // 내 꽃 세트 갱신 (길드장은 별별 기준)
    const effectiveNick = (nickname === "길드장") ? "별별" : nickname;
    const safeNick = effectiveNick.replace(/[.#$\/\[\]]/g,"_");
    myFlowerSet = new Set(
      Object.entries(selections)
        .filter(([, nicks]) => nicks && nicks[safeNick])
        .map(([key]) => key)
    );

    // 읽기전용 배너 업데이트
    const banner = document.getElementById("readonly-banner");
    if (banner) banner.classList.toggle("on", readOnly);

    // readOnly 전환 시 로그인 상태였으면 강제 로그아웃 (길드장 제외)
    if (readOnly && nickname && nickname !== "길드장") {
      showToast("읽기 전용 상태로 전환됐어요. 자동 로그아웃됩니다.");
      setTimeout(() => doLogout(), 1500);
      return;
    }

    renderContent();
  });
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(pin + salt + "cozy_florist_2025");
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function safeKey(s) { return s.replace(/[.#$\/\[\]]/g,"_"); }

// ── 자동 로그인 ──────────────────────────────────────────
async function tryAutoLogin() {
  try {
    const saved = localStorage.getItem("cozy_pin_autologin");
    if (!saved) return false;
    const {nick, pin} = JSON.parse(saved);
    if (!nick || !pin) return false;
    const [roSnap, blSnap, pinSnap] = await Promise.all([
      get(ref(db,"readOnly")), get(ref(db,"blocked")), get(ref(db,`pins/${safeKey(nick)}`))
    ]);
    if (roSnap.val()===true && nick!=="길드장") { localStorage.removeItem("cozy_pin_autologin"); return false; }
    if ((blSnap.val()||[]).includes(nick)) { localStorage.removeItem("cozy_pin_autologin"); return false; }
    const stored = pinSnap.val();
    if (!stored) { localStorage.removeItem("cozy_pin_autologin"); return false; }
    const hashed = await hashPin(pin, stored.salt);
    if (hashed !== stored.hash) { localStorage.removeItem("cozy_pin_autologin"); return false; }
    await completeLogin(nick);
    return true;
  } catch(e) { return false; }
}

// ── 로그인 시작 ──────────────────────────────────────────
window.doLogin = async function() {
  const nick = document.getElementById("nick-input").value.trim();
  if (!nick) { showToast("닉네임을 입력해주세요"); return; }

  const roSnap = await get(ref(db,"readOnly"));
  if (roSnap.val()===true && nick!=="길드장") {
    showToast("현재 읽기 전용 상태예요. 길드장이 해제할 때까지 로그인할 수 없어요."); return;
  }
  const blSnap = await get(ref(db,"blocked"));
  if ((blSnap.val()||[]).includes(nick)) { showToast("길드장에 의해 사용이 제한된 계정입니다."); return; }

  const pinSnap = await get(ref(db,`pins/${safeKey(nick)}`));
  const hasPIN = !!pinSnap.val();
  pinTargetNick = nick;

  if (hasPIN) {
    // PIN 있음 → PIN 확인 모달 (자동로그인 체크 표시)
    openPinModal("login-check", `🔐 ${nick}`, "PIN 4자리를 입력하세요", true, false);
  } else {
    // PIN 없음 → 바로 로그인
    await completeLogin(nick);
  }
}

// ── 로그인 완료 공통 ─────────────────────────────────────
async function completeLogin(nick) {
  const effectiveNick = (nick==="길드장") ? "별별" : nick;
  nickname = nick;
  window._effectiveNick = effectiveNick;

  await set(ref(db, `members/${safeKey(nick)}`), true);

  document.getElementById("login-inline-form").style.display = "none";
  document.getElementById("login-inline-user").style.display = "flex";
  document.getElementById("header-nick").textContent = nick==="길드장" ? "길드장 (별별)" : nick;
  document.getElementById("tab-my").style.display = "flex";
  if (nick==="길드장") document.getElementById("admin-tab").style.display = "flex";

  // PIN 보유 여부 확인 후 🔒 버튼 스타일 반영
  const pinSnap = await get(ref(db,`pins/${safeKey(nick)}`));
  pinHasPin = !!pinSnap.val();
  updatePinLockBtn();

  switchTab("my");
  subscribeDB();
}

function updatePinLockBtn() {
  const btn = document.getElementById("pin-lock-btn");
  if (!btn) return;
  if (pinHasPin) {
    btn.textContent = "🔒 PIN"; btn.className = "pin-lock-btn secured";
    btn.title = "PIN 변경/해제";
  } else {
    btn.textContent = "🔓 PIN"; btn.className = "pin-lock-btn";
    btn.title = "PIN 설정하기";
  }
}

window.doLogout = function() {
  if (unsub) unsub();

// ── PIN 입력 처리 ────────────────────────────────────────
async function processPIN() {
  const pin = pinBuffer;
  pinBuffer = ""; updatePinDots();

  // 1. 로그인 시 PIN 확인
  if (pinMode === "login-check") {
    const pinSnap = await get(ref(db,`pins/${safeKey(pinTargetNick)}`));
    const stored = pinSnap.val();
    if (!stored) { setPinError("PIN 정보를 찾을 수 없어요"); return; }
    const hashed = await hashPin(pin, stored.salt);
    if (hashed !== stored.hash) { setPinError("PIN이 틀렸어요"); return; }
    // 자동 로그인 저장
    if (document.getElementById("pin-autologin").checked)
      localStorage.setItem("cozy_pin_autologin", JSON.stringify({nick:pinTargetNick, pin}));
    closePinModal();
    await completeLogin(pinTargetNick);
    return;
  }

  // 2. 새 PIN 설정 — 첫 번째 입력
  if (pinMode === "pin-set-new") {
    pinFirstEntry = pin;
    document.getElementById("pin-sub").textContent = "한 번 더 입력해 확인해요";
    document.getElementById("pin-error").textContent = "";
    pinMode = "pin-set-confirm";
    return;
  }

  // 3. 새 PIN 설정 — 확인 입력
  if (pinMode === "pin-set-confirm") {
    if (pin !== pinFirstEntry) { setPinError("PIN이 달라요. 다시 처음부터"); pinMode = "pin-set-new";
      document.getElementById("pin-sub").textContent = "새 PIN 4자리를 입력하세요"; return; }
    const salt = crypto.randomUUID().slice(0,8);
    const hash = await hashPin(pin, salt);
    await set(ref(db,`pins/${safeKey(nickname)}`), {hash, salt});
    pinHasPin = true; updatePinLockBtn();
    closePinModal(); showToast("🔒 PIN이 설정됐어요!");
    return;
  }

  // 4. PIN 변경 — 기존 PIN 확인
  if (pinMode === "pin-change-old") {
    const pinSnap = await get(ref(db,`pins/${safeKey(nickname)}`));
    const stored = pinSnap.val();
    const hashed = await hashPin(pin, stored.salt);
    if (hashed !== stored.hash) { setPinError("기존 PIN이 틀렸어요"); return; }
    document.getElementById("pin-sub").textContent = "새 PIN 4자리를 입력하세요";
    document.getElementById("pin-error").textContent = "";
    pinMode = "pin-set-new"; return;
  }

  // 5. PIN 해제 — 기존 PIN 확인
  if (pinMode === "pin-remove") {
    const pinSnap = await get(ref(db,`pins/${safeKey(nickname)}`));
    const stored = pinSnap.val();
    const hashed = await hashPin(pin, stored.salt);
    if (hashed !== stored.hash) { setPinError("PIN이 틀렸어요"); return; }
    await remove(ref(db,`pins/${safeKey(nickname)}`));
    localStorage.removeItem("cozy_pin_autologin");
    pinHasPin = false; updatePinLockBtn();
    closePinModal(); showToast("🔓 PIN이 해제됐어요");
    return;
  }
}

// ── 초성 검색 유틸 ──────────────────────────────────────────
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str) {
  return str.split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return ch; // 한글 아닌 문자 그대로
    return CHOSUNG[Math.floor(code / 21 / 28)];
  }).join('');
}
function matchSearch(name, q) {
  if (!q) return true;
  const lo = q.toLowerCase();
  // 일반 포함 검색
  if (name.toLowerCase().includes(lo)) return true;
  // 꽃 이름 핵심(마지막 단어) 포함 검색
  const core = name.split(' ').slice(-1)[0];
  if (core.toLowerCase().includes(lo)) return true;
  // 초성 검색: 입력이 초성만으로 구성된 경우
  const isChosungOnly = [...q].every(c => CHOSUNG.includes(c));
  if (isChosungOnly) {
    const nameChosung = getChosung(name);
    const coreChosung = getChosung(core);
    if (nameChosung.includes(q)) return true;
    if (coreChosung.includes(q)) return true;
  }
  return false;
}

// 신규꽃 우선 정렬 키 (isNewFlower면 0, 아니면 1 → 오름차순으로 신규가 앞)
function newFirst(f) { return isNewFlower(f) ? 0 : 1; }

function getFiltered() {
  let list = allFlowers();
  if (filterGrade !== "전체") list = list.filter(f => f.grade === filterGrade);
  if (filterCond !== "전체") list = list.filter(f => f.cond === filterCond);
  if (searchText) list = list.filter(f => matchSearch(f.name, searchText));
  list.sort((a,b) => {
    // 1순위: 신규꽃(추가됨 표기) 최상단
    const nf = newFirst(a) - newFirst(b);
    if (nf !== 0) return nf;
    // 2순위: 기존 정렬
    let result = 0;
    if (sortBy === "grade") {
      result = (GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade]) || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else if (sortBy === "cond") {
      result = a.cond.localeCompare(b.cond, "ko") || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else {
      result = sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    }
    if (sortBy !== "cond" && sortReverse) result *= -1;
    return result;
  });
  return list;
}

function getAllConds() {
  return ["전체",...Array.from(new Set(allFlowers().map(f=>f.cond).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ko"))];
}

          </div>
          <select class="filter-select" id="grade-filter">
            ${["전체","N","R","SR","SSR","UR"].map(g=>`<option${filterGrade===g?" selected":""}>${g}</option>`).join("")}

          <select class="filter-select" id="cond-filter">
            ${getAllConds().map(c=>`<option${filterCond===c?" selected":""}>${c}</option>`).join("")}
          </select>
          <div class="sort-pills">
            ${[["name","이름순"],["grade","등급순"],["cond","획득 방법순"]].map(([v,l])=>`<button class="sort-pill${sortBy===v?" active":""}" onclick="setSortBy('${v}')">${l}</button>`).join("")}

        </button>` : ""}

    // 이벤트는 껍데기 생성 시 1회만 바인딩
    const inp = document.getElementById("search-input");
    inp.addEventListener("compositionstart", () => { composing = true; });

  const list = getFiltered();

  fl.innerHTML = list.map(f => {

      <span class="grade-badge grade-${f.grade}">${f.grade}</span>

      <span class="flower-cond">${f.cond}</span>
      <span class="flower-actions">
        ${isCustom ? `<button class="flower-action-btn edit-btn" data-fbkey="${f.fbKey}" title="수정">✏️</button>` : ""}
        ${showDelBtn ? `<button class="flower-action-btn del del-btn" data-fid="${safeId}" data-iscustom="${isCustom}" ${isCustom?`data-fbkey="${f.fbKey}"`:`data-numid="${f.id}"`} title="삭제">🗑</button>` : ""}

window.setSortBy = function(v) {

  });

window.toggleReverseSort = function() {
  sortReverse = !sortReverse;
  const btn = document.querySelector("#my-shell .sort-pill[onclick='toggleReverseSort()']");
  if (btn) btn.classList.toggle("active", sortReverse);

}

function updateGuildList() {
  const flowers = allFlowers();
  let list = [...flowers];

  // 필터
  if (guildView==="unowned") list = list.filter(f => {
    const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
    const n = selections[safeId]; return !n || Object.keys(n).length===0;
  });
  if (guildFilterGrade!=="전체") list = list.filter(f => f.grade===guildFilterGrade);
  if (guildFilterCond!=="전체") list = list.filter(f => f.cond===guildFilterCond);
  if (guildSearch) {
    if (guildSortBy==="member") {
      list = list.filter(f => {
        const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
        const nicks = selections[safeId] ? Object.keys(selections[safeId]) : [];
        return nicks.some(n => matchSearch(n, guildSearch));
      });
    } else {
      list = list.filter(f => matchSearch(f.name, guildSearch));
    }
  }

  // 정렬
  list.sort((a,b) => {
    // 1순위: 신규꽃(추가됨) 최상단 — 단, 등록순 모드일 때는 예외
    if (guildSortBy !== "register") {
      const nf = newFirst(a) - newFirst(b);
      if (nf !== 0) return nf;
    }
    // 2순위: 선택된 정렬
    let result = 0;
    const activeSortBy = (guildSortBy==="member") ? memberSubSort : guildSortBy;
    if (guildSortBy==="count") {
      const safeA = String(a.id).replace(/[.#$\/\[\]]/g,"_");
      const safeB = String(b.id).replace(/[.#$\/\[\]]/g,"_");
      const ca = selections[safeA] ? Object.keys(selections[safeA]).length : 0;
      const cb = selections[safeB] ? Object.keys(selections[safeB]).length : 0;
      result = cb - ca || sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    } else if (guildSortBy==="register") {
      // 등록순: 기본꽃(addedAt없음)은 id 오름차순, 커스텀꽃은 addedAt 오름차순
      const atA = a.addedAt ?? (typeof a.id==="number" ? a.id : 999999);
      const atB = b.addedAt ?? (typeof b.id==="number" ? b.id : 999999);
      result = atA - atB || sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    } else if (activeSortBy==="grade") {
      result = (GRADE_ORDER[a.grade]-GRADE_ORDER[b.grade]) || sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    } else if (activeSortBy==="cond") {
      result = a.cond.localeCompare(b.cond,"ko") || sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    } else if (guildSortBy==="member") {
      const safeA = String(a.id).replace(/[.#$\/\[\]]/g,"_");
      const safeB = String(b.id).replace(/[.#$\/\[\]]/g,"_");
      const ca = selections[safeA] ? Object.keys(selections[safeA]).length : 0;
      const cb = selections[safeB] ? Object.keys(selections[safeB]).length : 0;
      result = cb - ca || sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    } else {
      result = sortKey(a.name).localeCompare(sortKey(b.name),"ko");
    }
    if (activeSortBy!=="cond" && guildSortBy!=="cond" && guildSortReverse) result *= -1;
    return result;
  });

  const gl = document.getElementById("guild-flower-list");
  if (!gl) return;
  gl.innerHTML = list.map(f => {
    const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
    const nicks = selections[safeId] ? Object.keys(selections[safeId]) : [];
    const has = nicks.length > 0;
    const isCustom = typeof f.id==="string" && f.id.startsWith("c_");
    return `<div class="guild-row${has?"":" unowned"}">
      <div class="guild-row-top">
        <span class="grade-badge grade-${f.grade}">${f.grade}</span>
        <span class="flower-name">${f.name}</span>
        ${isCustom && isNewFlower(f) ? '<span class="custom-tag">추가됨</span>' : ""}
        ${!has?'<span class="unowned-badge">미보유</span>':""}
      </div>
      ${has?`<div class="owner-chips">${nicks.map(n=>`<span class="owner-chip">${n}</span>`).join("")}</div>`:""}
    </div>`;
  }).join("") + (list.length===0?'<div class="empty">검색 결과가 없거나 모든 꽃이 보유되어 있어요 🎉</div>':"");
}

function eventSubscribe(){
  eventSubbed = true;
  onValue(ref(db,"event"), snap => {
    eventData = snap.val() || null;
    if(currentTab === "event"){
      renderEvent();
      startEventClock();
    }
  });
}

function eventClearTimers(){
  eventAnimationTimers.forEach(t=>clearTimeout(t));
  eventAnimationTimers = [];
  if(eventTimer){ clearInterval(eventTimer); eventTimer=null; }
}

function startEventClock(){
  if(eventClockTimer) clearInterval(eventClockTimer);
  const tick = () => {
    const el = document.getElementById("event-clock");
    if(!el) return;
    el.textContent = new Intl.DateTimeFormat("ko-KR",{
      timeZone:"Asia/Seoul",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true
    }).format(new Date());
  };
  tick();
  eventClockTimer = setInterval(tick,1000);
  startEventSchedule();
}

function eventEsc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function eventCandidates(){
  if(!eventData || !eventData.candidates) return [];
  return Array.isArray(eventData.candidates) ? eventData.candidates : Object.values(eventData.candidates);
}
function eventResults(){
  if(!eventData || !eventData.results) return [];
  return Array.isArray(eventData.results) ? eventData.results : Object.values(eventData.results);
}
function eventWinnersSet(){
  return new Set(eventResults().map(x=>x.winner).filter(Boolean));
}

window.saveEventSettings = async function(){
  if(nickname!=="길드장"){ showToast("길드장만 설정할 수 있어요."); return; }
  const title = document.getElementById("event-title-input").value.trim() || "🌷 정원산책 이벤트";
  const time = document.getElementById("event-time-input").value;
  const gifts = document.getElementById("event-gifts-input").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const candidates = [...document.querySelectorAll(".event-candidate-chip.on")].map(x=>x.dataset.eventNick);
  if(!time){ showToast("발표 시간을 정해주세요."); return; }
  if(candidates.length<1){ showToast("당첨자 후보를 한 명 이상 선택해주세요."); return; }
  if(gifts.length<1){ showToast("선물을 한 개 이상 등록해주세요."); return; }
  if(gifts.length>candidates.length){ showToast("선물 수가 후보자 수보다 많을 수 없어요."); return; }

  const announcementAt = new Date(time).toISOString();
  const now = Date.now();
  if(new Date(announcementAt).getTime() <= now){ showToast("미래 시간을 선택해주세요."); return; }

  eventClearTimers();
  await set(ref(db,"event"),{
    title, announcementAt, gifts, candidates,
    status:"rolling", rollingName:candidates[0],
    results:[], currentGift:gifts[0],
    updatedAt:Date.now(), updatedBy:nickname
  });
  showToast("이벤트가 저장됐어요 🌸");
}

window.clearEvent = async function(){
  if(nickname!=="길드장") return;
  if(!confirm("현재 이벤트와 당첨 결과를 모두 초기화할까요?")) return;
  eventClearTimers();
  await remove(ref(db,"event"));
  showToast("이벤트가 초기화됐어요.");
}

function eventCountdownText(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return "✨ 발표 시간입니다!";
  const sec = Math.ceil(diff/1000);
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h ? `발표까지 ${h}시간 ${String(m).padStart(2,"0")}분 ${String(s).padStart(2,"0")}초`
           : `발표까지 ${m}분 ${String(s).padStart(2,"0")}초`;
}

function startEventSchedule(){
  eventClearTimers();
  if(!eventData || !eventData.announcementAt) return;
  const target = new Date(eventData.announcementAt).getTime();
  const tick = async ()=>{
    const now=Date.now(), diff=target-now;
    const cd=document.getElementById("event-countdown");
    if(cd) cd.textContent=eventCountdownText(eventData.announcementAt);
    if(diff<=60000 && diff>0){
      const n=document.getElementById("event-name");
      if(n) n.classList.add("spinning");
    }
    if(diff<=0){
      await eventTryDraw();
      return;
    }
  };
  tick();
  eventTimer=setInterval(tick,1000);
}

async function eventTryDraw(){
  if(eventDrawLock) return;
  eventDrawLock=true;
  eventClearTimers();

  const snap=await get(ref(db,"event"));
  const data=snap.val();
  if(!data || data.status==="finished"){ eventDrawLock=false; return; }

  const results=eventResults();
  const gifts=Array.isArray(data.gifts)?data.gifts:[];
  const candidates=Array.isArray(data.candidates)?data.candidates:Object.values(data.candidates||{});
  const available=candidates.filter(n=>!results.some(r=>r.winner===n));
  const index=results.length;
  if(index>=gifts.length || !available.length){
    await update(ref(db,"event"),{status:"finished"});
    eventDrawLock=false; return;
  }

  // crypto.getRandomValues를 사용해 균등한 무작위 인덱스를 생성한다.
  const buf=new Uint32Array(1);
  crypto.getRandomValues(buf);
  const winner=available[buf[0] % available.length];
  const gift=gifts[index];

  // 결과를 먼저 저장한다. 다른 접속자는 이 결과를 그대로 받아 동일한 당첨자를 표시한다.
  await update(ref(db,"event"),{
    status:"winner",
    currentGift:gift,
    rollingName:winner,
    [`results/${index}`]:{gift,winner,drawnAt:Date.now()}
  });

  // 발표 연출: 5초 후 다음 상품을 준비하고, 10초 후 다음 발표를 예약.
  setTimeout(async ()=>{
    const latest=(await get(ref(db,"event"))).val();
    if(!latest) return;
    const nextIndex=index+1;
    if(nextIndex>=gifts.length){
      await update(ref(db,"event"),{status:"finished"});
      return;
    }
    await update(ref(db,"event"),{
      status:"rolling", currentGift:gifts[nextIndex],
      rollingName:available.filter(n=>n!==winner)[0] || candidates[0]
    });
    setTimeout(()=>eventScheduleNext(),5000);
  },5000);
  eventDrawLock=false;
  launchFireworks();
}

function eventScheduleNext(){
  if(!eventData) return;
  // 다음 발표는 현재 시각 기준 10초 후, 5초 동안 감속 구간을 보여준다.
  const nextAt=Date.now()+10000;
  update(ref(db,"event"),{announcementAt:new Date(nextAt).toISOString()});
}

function launchFireworks(){
  const box=document.getElementById("event-fireworks");
  if(!box) return;
  box.innerHTML="";
  const icons=["🎆","🎇","✨","🌸","💐","⭐","🌟"];
  for(let i=0;i<18;i++){
    const f=document.createElement("div");
    f.className="firework";f.textContent=icons[i%icons.length];
    f.style.left=(5+Math.random()*90)+"%";f.style.top=(5+Math.random()*80)+"%";
    f.style.animationDelay=(Math.random()*.45)+"s";
    box.appendChild(f);
  }
  setTimeout(()=>{if(box) box.innerHTML="";},2300);
}

    if(n){

    }

  }
  lastEventResultCount=count;
}

window.startRename = function(oldNick) {
  const rowId = "mrow-" + oldNick.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const row = document.getElementById(rowId);
  if (!row) return;
  // 이미 편집 중인 다른 행이 있으면 취소
  document.querySelectorAll(".member-edit-row").forEach(el => {
    const orig = el.dataset.orig;
    if (orig) cancelRename(orig);
  });
  // 행을 편집 모드로 전환
  row.innerHTML = `
    <div class="member-edit-row" data-orig="${oldNick}">
      <input class="member-nick-input" id="rename-input-${rowId}" value="${oldNick}" maxlength="20" />
      <button class="member-save-btn" onclick="confirmRename('${oldNick}')">저장</button>
      <button class="member-cancel-btn" onclick="cancelRename('${oldNick}')">취소</button>
    </div>
  `;
  const inp = document.getElementById("rename-input-" + rowId);
  if (inp) { inp.focus(); inp.select(); }
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") confirmRename(oldNick);
    if (e.key === "Escape") cancelRename(oldNick);
  });
}

window.cancelRename = function(oldNick) {
  // 관리자 탭 다시 그려서 원상복구
  renderAdmin();
}

window.confirmRename = async function(oldNick) {
  const rowId = "mrow-" + oldNick.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const inp = document.getElementById("rename-input-" + rowId);
  if (!inp) return;
  const newNick = inp.value.trim();
  if (!newNick) { showToast("닉네임을 입력해주세요"); return; }
  if (newNick === oldNick) { renderAdmin(); return; }
  if (members[newNick.replace(/[.#$\/\[\]]/g,"_")]) {
    showToast(`"${newNick}"은 이미 존재하는 닉네임이에요`); return;
  }

  inp.disabled = true;
  try {
    const safeOld = oldNick.replace(/[.#$\/\[\]]/g,"_");
    const safeNew = newNick.replace(/[.#$\/\[\]]/g,"_");
    const updates = {};

    // 1. members: 새 닉네임 추가, 구 닉네임 삭제
    updates[`members/${safeNew}`] = true;
    updates[`members/${safeOld}`] = null;

    // 2. selections: 모든 꽃에서 구 닉네임 → 새 닉네임으로 교체
    const selSnap = await get(ref(db, "selections"));
    const selData = selSnap.val() || {};
    for (const [flowerId, nicks] of Object.entries(selData)) {
      if (nicks && nicks[safeOld]) {
        updates[`selections/${flowerId}/${safeNew}`] = true;
        updates[`selections/${flowerId}/${safeOld}`] = null;
      }
    }

    // 3. blocked 목록에 있으면 교체
    if (blocked.includes(oldNick)) {
      const newBlocked = blocked.map(b => b === oldNick ? newNick : b);
      updates["blocked"] = newBlocked;
    }

    await update(ref(db), updates);
    showToast(`✅ "${oldNick}" → "${newNick}" 변경 완료!`);
  } catch(e) {
    showToast("변경 중 오류가 발생했어요");
    inp.disabled = false;
  }
}

window.migrateGuildMasterNick = async function() {
  if (!confirm('"길드장" 닉네임으로 체크된 꽃을 전부 "별별"로 바꿀까요?')) return;
  const snap = await get(ref(db, "selections"));
  const data = snap.val() || {};
  let count = 0;
  const updates = {};
  for (const [flowerId, nicks] of Object.entries(data)) {
    if (nicks && nicks["길드장"]) {
      updates[`selections/${flowerId}/별별`] = true;
      updates[`selections/${flowerId}/길드장`] = null;
      count++;
    }
  }
  if (count === 0) { showToast("변경할 데이터가 없어요 (이미 완료됐거나 없음)"); return; }
  await update(ref(db), updates);
  showToast(`✅ ${count}개 꽃의 닉네임을 별별로 변경했어요`);
}

let boardPosts   = {};   // { postId: { author, text, imgUrl, color, pinned, notice, createdAt, comments:{} } }
let boardSubbed  = false;
let boardEditId  = null; // 수정 중인 postId
let boardColorIdx = 0;
const BOARD_COLORS = ['#fff9c4','#fce4ec','#e3f2fd','#f3e5f5','#e8f5e9','#fff3e0','#e8eaf6','#f9fbe7'];
const AVATAR_COLORS = ['#81c784','#f48fb1','#64b5f6','#ce93d8','#ffb74d','#4db6ac','#a1887f','#90a4ae'];

function avatarColor(nick) {
  let n=0; for(let c of (nick||'')) n+=c.charCodeAt(0);
  return AVATAR_COLORS[n % AVATAR_COLORS.length];
}
function avatarLetter(nick) { return (nick||'?')[0].toUpperCase(); }
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return '방금';
  if (d < 3600000) return Math.floor(d/60000)+'분 전';
  if (d < 86400000) return Math.floor(d/3600000)+'시간 전';
  const dt = new Date(ts);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

function boardSubscribe() {
  boardSubbed = true;
  onValue(ref(db, "board"), snap => {
    boardPosts = snap.val() || {};
    if (currentTab === "board") renderBoard();
  });
}

function renderBoard() {
  const isAdmin = nickname === "길드장";
  const loggedIn = !!nickname;

  // 게시물 정렬: 공지 먼저, 그 다음 최신순
  const posts = Object.entries(boardPosts)
    .map(([id, p]) => ({id, ...p}))
    .sort((a,b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return (b.createdAt||0) - (a.createdAt||0);
    });

  document.getElementById("content").innerHTML = `
    ${loggedIn
      ? `<button class="board-write-btn" onclick="openBoardModal()">✏️ 새 글 쓰기</button>`
      : `<div class="board-login-nudge">💬 글을 쓰려면 로그인해주세요</div>`
    }
    <div class="board-list" id="board-list">
      ${posts.length === 0 ? `<div class="board-empty">아직 게시물이 없어요 🌸<br>첫 글을 남겨보세요!</div>` :
        posts.map(p => renderBoardCard(p, isAdmin, loggedIn)).join("")}
    </div>
  `;

  // 댓글 입력창 이벤트 (이벤트 위임)
  document.getElementById("board-list")?.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && e.target.classList.contains("board-comment-input")) {
      e.preventDefault();
      const postId = e.target.dataset.pid;
      submitComment(postId, e.target.value.trim());
      e.target.value = "";
    }
  });
}

function renderBoardCard(p, isAdmin, loggedIn) {
  const ci = p.color ?? 0;
  const bg = BOARD_COLORS[ci] || BOARD_COLORS[0];
  const comments = p.comments ? Object.entries(p.comments).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0)) : [];
  const canDelete = isAdmin || p.author === nickname;
  const canEdit   = p.author === nickname;
  const canPin    = isAdmin;

  return `<div class="board-card${p.pinned?' pinned':''}" style="background:${bg}">
    <div class="board-card-header">
      <div class="board-avatar" style="background:${avatarColor(p.author)}">${avatarLetter(p.author)}</div>
      <span class="board-author">${p.author||'?'}</span>
      <span class="board-time">${timeAgo(p.createdAt||0)}</span>
      ${p.pinned ? '<span class="board-pin-badge">📌 공지</span>' : ''}
    </div>
    ${p.imgUrl ? `<img class="board-card-img" src="${p.imgUrl}" alt="이미지" onerror="this.style.display='none'" onclick="window.open('${p.imgUrl}','_blank')">` : ''}
    <div class="board-card-body">${escHtml(p.text||'')}</div>
    <div class="board-card-footer">
      ${canEdit   ? `<button class="board-action-btn" onclick="openEditBoard('${p.id}')">✏️ 수정</button>` : ''}
      ${canDelete ? `<button class="board-action-btn danger" onclick="deleteBoard('${p.id}')">🗑 삭제</button>` : ''}
      ${canPin    ? `<button class="board-action-btn" onclick="togglePin('${p.id}',${!!p.pinned})">${p.pinned?'📌 고정 해제':'📌 공지 고정'}</button>` : ''}
      <span class="board-comment-count">💬 ${comments.length}</span>
    </div>
    <div class="board-comments">
      ${comments.map(([cid, c]) => `
        <div class="board-comment">
          <div class="board-comment-avatar" style="background:${avatarColor(c.author)}">${avatarLetter(c.author)}</div>
          <div class="board-comment-body">
            <div style="display:flex;align-items:center;gap:6px">
              <span class="board-comment-nick">${c.author||'?'}</span>
              <span style="font-size:10px;color:var(--text3)">${timeAgo(c.createdAt||0)}</span>
              ${(isAdmin || c.author===nickname) ? `<button class="board-comment-del" onclick="deleteComment('${p.id}','${cid}')">✕</button>` : ''}
            </div>
            <div class="board-comment-text">${escHtml(c.text||'')}</div>
          </div>
        </div>`).join('')}
      ${loggedIn ? `<div class="board-comment-input-row">
        <input class="board-comment-input" data-pid="${p.id}" placeholder="댓글 달기… (Enter로 전송)" maxlength="200">
        <button class="board-comment-submit" onclick="submitCommentBtn('${p.id}',this)">전송</button>
      </div>` : ''}
    </div>
  </div>`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.submitBoard = async function() {
  const text = document.getElementById("board-text").value.trim();
  const imgUrl = document.getElementById("board-img-url").value.trim();
  if (!text) { showToast("내용을 입력해주세요"); return; }

  if (boardEditId) {
    // 수정
    await update(ref(db, `board/${boardEditId}`), { text, imgUrl, color: boardColorIdx });
    showToast("수정됐어요 ✓");
  } else {
    // 새 글
    const pinned = (nickname === "길드장") && document.getElementById("board-pin-check").checked;
    await push(ref(db, "board"), {
      author: nickname,
      text, imgUrl,
      color: boardColorIdx,
      pinned: pinned || false,
      createdAt: Date.now()
    });
    showToast("게시됐어요 🌸");
  }
  document.getElementById("board-modal").style.display = "none";
  boardEditId = null;
}

window.deleteBoard = async function(postId) {
  if (!confirm("이 글을 삭제할까요?")) return;
  await remove(ref(db, `board/${postId}`));
  showToast("삭제됐어요");
}

window.togglePin = async function(postId, currentPinned) {
  await set(ref(db, `board/${postId}/pinned`), !currentPinned);
  showToast(!currentPinned ? "📌 공지로 고정됐어요" : "고정이 해제됐어요");
}

window.submitComment = async function(postId, text) {
  if (!text || !nickname) return;
  await push(ref(db, `board/${postId}/comments`), {
    author: nickname,
    text,
    createdAt: Date.now()
  });
}

window.submitCommentBtn = function(postId, btn) {
  const inp = btn.previousElementSibling;
  const text = inp.value.trim();
  if (!text) return;
  submitComment(postId, text);
  inp.value = "";
}

window.deleteComment = async function(postId, commentId) {
  await remove(ref(db, `board/${postId}/comments/${commentId}`));
  showToast("댓글이 삭제됐어요");
}
</script>
</body>
</html>
