<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 코지 플로리스트 정원산책길드 소유꽃확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#4caf50;--green-light:#e8f5e9;--green-mid:#a5d6a7;
    --blue:#1976d2;--blue-light:#e3f2fd;--blue-mid:#90caf9;
    --purple:#6a1b9a;--purple-light:#f3e5f5;--purple-mid:#ce93d8;
    --yellow:#f57f17;--yellow-light:#fffde7;--yellow-mid:#fff176;
    --red:#b71c1c;--red-light:#fce4ec;--red-mid:#f48fb1;
    --bg:#faf9f7;--card:#fff;--border:#e8e4df;--border2:#d4cfc9;
    --text:#2c2825;--text2:#6b6560;--text3:#9e9890;
    --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  }
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  
  /* LOGIN */
  #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1.5rem;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1.2rem;align-items:center;}
  .login-emoji{font-size:48px;}
  .login-title{font-size:20px;font-weight:700;color:var(--text);}
  .login-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;}
  .login-input{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .2s;}
  .login-input:focus{border-color:var(--green);}
  .login-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;}
  .login-btn:hover{background:#388e3c;}
  .login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6;}

  /* APP */
  #app-screen{display:none;flex-direction:column;min-height:100vh;}
  
  /* HEADER */
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
  .header-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.3;}
  .header-credit{font-size:10px;font-weight:400;color:var(--text3);margin-left:2px;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .nick-badge{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
  .logout-btn{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{color:var(--text);}

  /* TABS */
  .tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 1rem;}
  .tab{padding:12px 14px;font-size:14px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:all .15s;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  /* CONTENT */
  .content{flex:1;padding:1rem;}

  /* FILTERS */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}
  .search-wrap{position:relative;flex:1;min-width:140px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);}
  .search-input{width:100%;padding:9px 10px 9px 34px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .search-input:focus{border-color:var(--green);}
  .filter-select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .sort-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .sort-pill{padding:6px 11px;border-radius:20px;font-size:12px;font-family:inherit;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;}
  .sort-pill.active{background:var(--green-light);border-color:var(--green-mid);color:#2e7d32;font-weight:500;}

  /* FLOWER LIST */
  .flower-list{display:flex;flex-direction:column;gap:6px;}
  .flower-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
  .flower-row:active{transform:scale(.98);}
  .flower-row.selected{background:var(--green-light);border-color:var(--green-mid);}
  .grade-badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .grade-N{background:var(--green-light);color:#2e7d32;border:1px solid var(--green-mid);}
  .grade-R{background:var(--blue-light);color:#1565c0;border:1px solid var(--blue-mid);}
  .grade-SR{background:var(--purple-light);color:#4a148c;border:1px solid var(--purple-mid);}
  .grade-SSR{background:var(--yellow-light);color:#e65100;border:1px solid var(--yellow-mid);}
  .grade-UR{background:var(--red-light);color:#b71c1c;border:1px solid var(--red-mid);}
  .flower-name{font-size:14px;flex:1;color:var(--text);}
  .flower-cond{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
  .check-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .check-icon.on{background:var(--green);color:#fff;}
  .check-icon.off{background:var(--border);color:transparent;}

  /* GUILD VIEW */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
  .stat-num{font-size:22px;font-weight:700;color:var(--text);}
  .stat-num.warn{color:#e53935;}
  .stat-num.ok{color:#43a047;}
  .stat-label{font-size:11px;color:var(--text2);margin-top:2px;}
  .guild-row{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);}
  .guild-row.unowned{border-color:#ef9a9a;background:#fff8f8;}
  .guild-row-top{display:flex;align-items:center;gap:8px;}
  .unowned-badge{font-size:10px;background:var(--red-light);color:#c62828;border-radius:8px;padding:2px 7px;border:1px solid var(--red-mid);flex-shrink:0;}
  .owner-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .owner-chip{font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:2px 8px;color:var(--text2);}

  /* ADMIN */
  .admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .section-title{font-size:14px;font-weight:700;margin-bottom:1rem;color:var(--text);}
  .admin-input-row{display:flex;gap:8px;margin-bottom:1rem;}
  .admin-input{flex:1;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
  .admin-input:focus{border-color:var(--green);}
  .admin-btn{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .admin-btn:hover{background:var(--border);}
  .admin-btn.danger{border-color:#ef9a9a;color:#c62828;background:var(--red-light);}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:#fff;}
  .blocked-row{border-color:#ef9a9a;background:var(--red-light);}
  .member-name{flex:1;font-size:14px;}
  .member-count{font-size:12px;color:var(--text2);}

  /* 닉네임 인라인 편집 */
  .member-edit-row{display:flex;align-items:center;gap:6px;flex:1;}
  .member-nick-input{flex:1;padding:5px 9px;border:1.5px solid var(--green-mid);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .member-nick-input:focus{border-color:var(--green);}
  .member-save-btn{padding:5px 12px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .member-save-btn:hover{background:#388e3c;}
  .member-cancel-btn{padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;font-family:inherit;cursor:pointer;}
  .rename-btn{font-size:12px;color:#1565c0;border:1px solid var(--blue-mid);border-radius:8px;padding:3px 10px;cursor:pointer;background:var(--blue-light);font-family:inherit;}
  .rename-btn:hover{background:var(--blue-mid);color:#fff;}
  .blocked-tag{font-size:11px;background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:2px 8px;}
  .unblock-btn{font-size:12px;color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:3px 10px;cursor:pointer;background:transparent;font-family:inherit;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* EMPTY */
  .empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px;}

  /* 헤더 로그인 영역 */
  .login-inline{display:flex;align-items:center;gap:6px;}
  .login-inline-input{padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100px;}
  .login-inline-input:focus{border-color:var(--green);}
  .login-inline-btn{padding:5px 12px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .login-inline-btn:hover{background:#388e3c;}

  /* 읽기전용 배너 */
  .readonly-banner{display:none;background:#fff3e0;border-bottom:1px solid #ffcc80;padding:7px 1rem;font-size:12px;color:#e65100;font-weight:500;text-align:center;}
  .readonly-banner.on{display:block;}

  /* 긴급버튼 */
  .danger-section{background:#fff5f5;border:1.5px solid #ef9a9a;border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .danger-section-title{font-size:14px;font-weight:700;color:#c62828;margin-bottom:.6rem;}
  .readonly-toggle-btn{width:100%;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all .2s;}
  .readonly-toggle-btn.enable{background:#e53935;color:#fff;}
  .readonly-toggle-btn.enable:hover{background:#c62828;}
  .readonly-toggle-btn.disable{background:#43a047;color:#fff;}
  .readonly-toggle-btn.disable:hover{background:#2e7d32;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}

  /* SAVE BAR */
  .save-bar{background:var(--green-light);border-bottom:1px solid var(--green-mid);padding:6px 1rem;font-size:12px;color:#2e7d32;text-align:center;font-weight:500;}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .modal{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:1.2rem;color:var(--text);}
  .modal-field{display:flex;flex-direction:column;gap:5px;margin-bottom:.9rem;}
  .modal-label{font-size:12px;font-weight:500;color:var(--text2);}
  .modal-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100%;}
  .modal-input:focus{border-color:var(--green);}
  .modal-row{display:flex;gap:8px;margin-top:.4rem;}
  .modal-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;}
  .modal-btn.primary{background:var(--green);color:#fff;}
  .modal-btn.primary:hover{background:#388e3c;}
  .modal-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border2);}
  .modal-btn.secondary:hover{background:var(--border);}
  .modal-btn.danger-btn{background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);}

  /* CUSTOM FLOWER BADGE */
  .custom-tag{font-size:10px;background:#fff8e1;color:#e65100;border:1px solid #ffcc02;border-radius:8px;padding:1px 6px;flex-shrink:0;}
  .flower-actions{display:flex;gap:4px;flex-shrink:0;}
  .flower-action-btn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .flower-action-btn:hover{background:var(--border);}
  .flower-action-btn.del{border-color:var(--red-mid);color:#c62828;background:var(--red-light);}

  /* ADD BUTTON */
  .add-flower-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;margin-bottom:1rem;}
  .add-flower-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light);}

  @media(max-width:400px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .flower-cond{display:none;}
  }

  /* ── 교환코드 탭 ── */
  .coupon-hero{background:linear-gradient(160deg,#f5ede3 0%,#eee6d6 60%,#ddd4c2 100%);padding:20px 1.25rem 16px;border-bottom:1px solid #e2d9ce;position:relative;overflow:hidden;margin-bottom:1rem;}
  .coupon-hero::before{content:'🌸';font-size:60px;position:absolute;top:-8px;left:-8px;opacity:.1;transform:rotate(-20deg);}
  .coupon-hero::after{content:'🌿';font-size:60px;position:absolute;bottom:-8px;right:-8px;opacity:.1;transform:rotate(20deg);}
  .coupon-hero-title{font-size:15px;font-weight:700;color:#3d2e1e;position:relative;}
  .coupon-hero-sub{font-size:12px;color:#8a7060;margin-top:3px;position:relative;}
  .coupon-stats{display:flex;gap:16px;margin-top:12px;position:relative;}
  .coupon-stat{text-align:center;background:rgba(255,255,255,.55);border-radius:var(--radius-sm);padding:7px 14px;}
  .coupon-stat-num{font-size:18px;font-weight:700;color:#3d2e1e;display:block;}
  .coupon-stat-label{font-size:10px;color:#8a7060;}

  .howto-box{background:#fff9f0;border:1px solid #e8d9c4;border-radius:var(--radius);overflow:hidden;margin:0 0 1rem;}
  .howto-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;}
  .howto-header-title{font-size:13px;font-weight:700;color:#7a5c3e;}
  .howto-arrow{font-size:11px;color:#a89080;transition:transform .3s;display:inline-block;}
  .howto-arrow.open{transform:rotate(180deg);}
  .howto-body{display:none;padding:0 14px 12px;border-top:1px solid #ede5db;}
  .howto-body.open{display:block;}
  .howto-steps{display:flex;flex-direction:column;gap:0;margin-top:10px;}
  .howto-step{display:flex;align-items:center;gap:10px;position:relative;}
  .howto-step:not(:last-child)::after{content:'';position:absolute;left:13px;top:28px;width:1px;height:16px;background:#e2d9ce;}
  .howto-num{width:26px;height:26px;border-radius:50%;background:#c8a882;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .howto-text{font-size:13px;color:#5a4030;padding:6px 0;line-height:1.4;}
  .howto-text strong{font-weight:700;color:#3d2e1e;}
  .howto-tip{margin-top:8px;padding:7px 10px;background:#f5ede3;border-radius:8px;font-size:11px;color:#8a7060;line-height:1.5;}

  .cpn-filter-bar{display:flex;gap:6px;margin-bottom:.85rem;flex-wrap:wrap;}
  .cpn-filter-btn{padding:6px 13px;border-radius:20px;font-size:12px;font-family:inherit;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;}
  .cpn-filter-btn.active{background:#c8a882;border-color:#c8a882;color:#fff;font-weight:500;}

  .cpn-section-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:.6rem;padding-left:2px;}

  .cpn-list{display:flex;flex-direction:column;gap:8px;}
  .cpn-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;transition:all .15s;}
  .cpn-card.expired{opacity:.5;background:#fafafa;}
  .cpn-card.new-card{border-color:#c8a882;background:#fffaf5;}
  .cpn-icon{width:34px;height:34px;flex-shrink:0;}
  .cpn-icon svg{width:34px;height:34px;}
  .cpn-code{font-size:14px;font-weight:500;color:var(--text);flex:1;word-break:break-all;line-height:1.4;}
  .cpn-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
  .cpn-badge-new{font-size:10px;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:8px;padding:1px 6px;font-weight:500;}
  .cpn-badge-exp{font-size:10px;background:#f5f5f5;color:#9e9e9e;border:1px solid #e0e0e0;border-radius:8px;padding:1px 6px;}
  .cpn-copy-btn{flex-shrink:0;padding:7px 13px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;font-family:inherit;border:1px solid #c8a882;background:#fff9f0;color:#7a5c3e;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .cpn-copy-btn:hover{background:#c8a882;color:#fff;}
  .cpn-copy-btn.copied{background:#c8a882;color:#fff;border-color:#c8a882;}
  .cpn-copy-btn.disabled{border-color:var(--border);background:var(--bg);color:var(--text3);cursor:default;}

  .cpn-admin-toggle{display:none;align-items:center;justify-content:space-between;margin-top:1rem;padding:11px 14px;background:#fff9f0;border:1px solid #e8d9c4;border-radius:var(--radius);cursor:pointer;user-select:none;}
  .cpn-admin-label{font-size:13px;font-weight:700;color:#7a5c3e;}
  .cpn-admin-arrow{font-size:11px;color:#a89080;transition:transform .3s;}
  .cpn-admin-arrow.open{transform:rotate(180deg);}
  .cpn-admin-panel{display:none;background:#fff9f0;border:1px solid #e8d9c4;border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:12px 14px;}
  .cpn-admin-panel.open{display:block;}
  .cpn-input-row{display:flex;gap:8px;margin-bottom:10px;}
  .cpn-admin-input{flex:1;padding:9px 12px;border:1px solid #e8d9c4;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .cpn-admin-input:focus{border-color:#c8a882;}
  .cpn-admin-btn{padding:9px 14px;border-radius:var(--radius-sm);border:none;background:#c8a882;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .cpn-admin-btn:hover{background:#b8956e;}
  .cpn-divider{border:none;border-top:1px solid #e8d9c4;margin:10px 0;}
  .cpn-admin-sub{font-size:12px;font-weight:500;color:#8a7060;margin-bottom:8px;}
  .cpn-expire-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0e8de;}
  .cpn-expire-code{font-size:13px;color:var(--text);}
  .cpn-expire-code.is-expired{color:var(--text3);text-decoration:line-through;}
  .cpn-toggle-expire{font-size:11px;padding:3px 10px;border-radius:8px;cursor:pointer;font-family:inherit;border:1px solid;}

// addedAt 기준 8일 이내인지 판별
const EIGHT_DAYS_MS = 8 * 24 * 60 * 60 * 1000;
function isNewFlower(f) {
  if (!f.addedAt) return false;
  return (Date.now() - f.addedAt) < EIGHT_DAYS_MS;
}

// ── 유틸 ───────────────────────────────────────────────────
function sortKey(name) {
  const parts = name.split(" ");
  return parts[parts.length - 1] + "|" + name;
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
function setSaveBar(msg, show) {
  const el = document.getElementById("save-bar");
  el.style.display = show ? "block" : "none";
  el.textContent = msg;
}

// ── Firebase 구독 ──────────────────────────────────────────
let readOnly = false;  // Firebase에서 읽어온 읽기전용 상태

function subscribeDB() {
  if (unsub) unsub();
  const r = ref(db, "/");
  unsub = onValue(r, snap => {
    const data = snap.val() || {};
    selections = data.selections || {};
    blocked = data.blocked || [];
    members = data.members || {};
    readOnly = data.readOnly === true;

    // 커스텀 꽃 로드
    const raw = data.customFlowers || {};
    customFlowers = Object.entries(raw).map(([fbKey, v]) => {
      const safeId = ("c_" + fbKey).replace(/[.#$\/\[\]]/g,"_");
      return { fbKey, id: safeId, grade: v.grade, cond: v.cond, name: v.name, addedBy: v.addedBy || "", addedAt: v.addedAt || null };
    });

    // 내 꽃 세트 갱신 (길드장은 별별 기준)
    const effectiveNick = (nickname === "길드장") ? "별별" : nickname;
    const safeNick = effectiveNick.replace(/[.#$\/\[\]]/g,"_");
    myFlowerSet = new Set(
      Object.entries(selections)
        .filter(([, nicks]) => nicks && nicks[safeNick])
        .map(([key]) => key)
    );

    // 읽기전용 배너 업데이트
    const banner = document.getElementById("readonly-banner");
    if (banner) banner.classList.toggle("on", readOnly);

    // readOnly 전환 시 로그인 상태였으면 강제 로그아웃 (길드장 제외)
    if (readOnly && nickname && nickname !== "길드장") {
      showToast("읽기 전용 상태로 전환됐어요. 자동 로그아웃됩니다.");
      setTimeout(() => doLogout(), 1500);
      return;
    }

    renderContent();
  });
}

// ── 로그인 ─────────────────────────────────────────────────
window.doLogin = async function() {
  const nick = document.getElementById("nick-input").value.trim();
  if (!nick) { showToast("닉네임을 입력해주세요"); return; }

  // 읽기전용 상태 확인 (길드장은 허용)
  const roSnap = await get(ref(db, "readOnly"));
  if (roSnap.val() === true && nick !== "길드장") {
    showToast("현재 읽기 전용 상태예요. 길드장이 해제할 때까지 로그인할 수 없어요.");
    return;
  }

  // 차단 확인
  const snap = await get(ref(db, "blocked"));
  const bl = snap.val() || [];
  if (bl.includes(nick)) { showToast("길드장에 의해 사용이 제한된 계정입니다."); return; }

  // 길드장으로 로그인하면 꽃 선택은 '별별' 닉네임으로 저장
  nickname = nick;
  const effectiveNick = (nick === "길드장") ? "별별" : nick;
  // selections에서 사용할 실제 닉네임 (길드장 → 별별)
  window._effectiveNick = effectiveNick;

  await set(ref(db, `members/${nick.replace(/[.#$\/\[\]]/g,"_")}`), true);

  // UI 전환
  document.getElementById("login-inline-form").style.display = "none";
  document.getElementById("login-inline-user").style.display = "flex";
  document.getElementById("header-nick").textContent = nick === "길드장" ? "길드장 (별별)" : nick;
  document.getElementById("tab-my").style.display = "flex";
  if (nick === "길드장") document.getElementById("admin-tab").style.display = "flex";

  switchTab("my");
  subscribeDB();
}

window.doLogout = function() {
  if (unsub) unsub();
  nickname = "";
  document.getElementById("login-inline-form").style.display = "flex";
  document.getElementById("login-inline-user").style.display = "none";
  document.getElementById("nick-input").value = "";
  document.getElementById("tab-my").style.display = "none";
  document.getElementById("admin-tab").style.display = "none";
  // 길드 현황으로 이동 후 비로그인 구독 시작
  currentTab = "guild";
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-guild").classList.add("active");
  subscribeDB();
}

document.getElementById("nick-input").addEventListener("keydown", e => {

// ── 초성 검색 유틸 ──────────────────────────────────────────
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str) {
  return str.split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return ch; // 한글 아닌 문자 그대로
    return CHOSUNG[Math.floor(code / 21 / 28)];
  }).join('');
}
function matchSearch(name, q) {
  if (!q) return true;
  const lo = q.toLowerCase();
  // 일반 포함 검색
  if (name.toLowerCase().includes(lo)) return true;
  // 꽃 이름 핵심(마지막 단어) 포함 검색
  const core = name.split(' ').slice(-1)[0];
  if (core.toLowerCase().includes(lo)) return true;
  // 초성 검색: 입력이 초성만으로 구성된 경우
  const isChosungOnly = [...q].every(c => CHOSUNG.includes(c));
  if (isChosungOnly) {
    const nameChosung = getChosung(name);
    const coreChosung = getChosung(core);
    if (nameChosung.includes(q)) return true;
    if (coreChosung.includes(q)) return true;
  }
  return false;
}

function getFiltered() {
  let list = allFlowers();
  if (filterGrade !== "전체") list = list.filter(f => f.grade === filterGrade);
  if (filterCond !== "전체") list = list.filter(f => f.cond === filterCond);
  if (searchText) list = list.filter(f => matchSearch(f.name, searchText));
  list.sort((a,b) => {
    let result = 0;
    if (sortBy === "grade") {
      result = (GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade]) || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else if (sortBy === "cond") {
      result = a.cond.localeCompare(b.cond, "ko") || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else {
      result = sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    }
    if (sortBy !== "cond" && sortReverse) result *= -1;
    return result;
  });
  return list;
}

function getAllConds() {
  return ["전체",...Array.from(new Set(allFlowers().map(f=>f.cond).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"ko"))];
}

let cpnCoupons = [];
let cpnFilter = 'all';
let cpnLoaded = false;
let cpnLoading = false;

function cpnIconIdx(code) {
  let n = 0; for (let c of code) n += c.charCodeAt(0);
  return n % CPN_SVGS.length;
}

async function cpnLoad() {
  if (cpnLoading) return;
  cpnLoading = true;
  renderCoupon();
  try {
    const res = await fetch(`${CPN_API}?action=get`);
    const data = await res.json();
    if (data.status === 'ok') {
      cpnCoupons = data.coupons;
      cpnLoaded = true;
    } else { cpnLoaded = 'error'; }
  } catch(e) { cpnLoaded = 'error'; }
  cpnLoading = false;
  if (currentTab === 'coupon') renderCoupon();
}
const cpnSubscribe = cpnLoad;

window.cpnCopy = function(code, btnId) {
  const dummy = document.createElement('textarea');
  dummy.value = code; document.body.appendChild(dummy); dummy.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(dummy);
  if (navigator.clipboard) navigator.clipboard.writeText(code).catch(()=>{});
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.textContent = '복사됨 ✓'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='복사'; btn.classList.remove('copied'); }, 1800);
}
window.cpnAddCode = async function() {
  const input = document.getElementById('cpn-code-input');
  const val = input.value.trim(); if (!val) return;
  input.disabled = true;
  try {
    const res = await fetch(`${CPN_API}?action=add&code=${encodeURIComponent(val)}`);
    const data = await res.json();
    if (data.status==='ok') {
      input.value = ''; cpnCoupons=[]; cpnLoaded=false; await cpnLoad();
    } else if (data.message==='Already exists') {
      input.style.borderColor='#e28080'; input.placeholder='이미 존재하는 코드예요!'; input.value='';
      setTimeout(()=>{ input.style.borderColor=''; input.placeholder='새 교환코드 입력'; },2000);
    }
  } catch(e) { showToast('저장 중 오류가 발생했어요'); }
  input.disabled = false;
}
window.cpnToggleExpire = async function(idx, code) {
  const newExpired = !cpnCoupons[idx].expired;
  cpnCoupons[idx].expired = newExpired; renderCoupon();
  try {
    const res = await fetch(`${CPN_API}?action=update&code=${encodeURIComponent(code)}&expired=${newExpired}`);
    const data = await res.json();
    if (data.status!=='ok') { cpnCoupons[idx].expired=!newExpired; renderCoupon(); showToast('저장 오류가 발생했어요'); }
  } catch(e) { cpnCoupons[idx].expired=!newExpired; renderCoupon(); showToast('저장 오류가 발생했어요'); }
}

window.startRename = function(oldNick) {
  const rowId = "mrow-" + oldNick.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const row = document.getElementById(rowId);
  if (!row) return;
  // 이미 편집 중인 다른 행이 있으면 취소
  document.querySelectorAll(".member-edit-row").forEach(el => {
    const orig = el.dataset.orig;
    if (orig) cancelRename(orig);
  });
  // 행을 편집 모드로 전환
  row.innerHTML = `
    <div class="member-edit-row" data-orig="${oldNick}">
      <input class="member-nick-input" id="rename-input-${rowId}" value="${oldNick}" maxlength="20" />
      <button class="member-save-btn" onclick="confirmRename('${oldNick}')">저장</button>
      <button class="member-cancel-btn" onclick="cancelRename('${oldNick}')">취소</button>
    </div>
  `;
  const inp = document.getElementById("rename-input-" + rowId);
  if (inp) { inp.focus(); inp.select(); }
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") confirmRename(oldNick);
    if (e.key === "Escape") cancelRename(oldNick);
  });
}

window.cancelRename = function(oldNick) {
  // 관리자 탭 다시 그려서 원상복구
  renderAdmin();
}

window.confirmRename = async function(oldNick) {
  const rowId = "mrow-" + oldNick.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const inp = document.getElementById("rename-input-" + rowId);
  if (!inp) return;
  const newNick = inp.value.trim();
  if (!newNick) { showToast("닉네임을 입력해주세요"); return; }
  if (newNick === oldNick) { renderAdmin(); return; }
  if (members[newNick.replace(/[.#$\/\[\]]/g,"_")]) {
    showToast(`"${newNick}"은 이미 존재하는 닉네임이에요`); return;
  }

  inp.disabled = true;
  try {
    const safeOld = oldNick.replace(/[.#$\/\[\]]/g,"_");
    const safeNew = newNick.replace(/[.#$\/\[\]]/g,"_");
    const updates = {};

    // 1. members: 새 닉네임 추가, 구 닉네임 삭제
    updates[`members/${safeNew}`] = true;
    updates[`members/${safeOld}`] = null;

    // 2. selections: 모든 꽃에서 구 닉네임 → 새 닉네임으로 교체
    const selSnap = await get(ref(db, "selections"));
    const selData = selSnap.val() || {};
    for (const [flowerId, nicks] of Object.entries(selData)) {
      if (nicks && nicks[safeOld]) {
        updates[`selections/${flowerId}/${safeNew}`] = true;
        updates[`selections/${flowerId}/${safeOld}`] = null;
      }
    }

    // 3. blocked 목록에 있으면 교체
    if (blocked.includes(oldNick)) {
      const newBlocked = blocked.map(b => b === oldNick ? newNick : b);
      updates["blocked"] = newBlocked;
    }

    await update(ref(db), updates);
    showToast(`✅ "${oldNick}" → "${newNick}" 변경 완료!`);
  } catch(e) {
    showToast("변경 중 오류가 발생했어요");
    inp.disabled = false;
  }
}

window.toggleReadOnly = async function() {
  const newState = !readOnly;
  const msg = newState
    ? "읽기 전용으로 전환할까요?\n길드장 외 모든 로그인이 차단됩니다."
    : "읽기 전용을 해제할까요?\n길드원들이 다시 로그인할 수 있어요.";
  if (!confirm(msg)) return;
  await set(ref(db, "readOnly"), newState);
  showToast(newState ? "🔒 읽기 전용으로 전환됐어요" : "🟢 정상 운영으로 전환됐어요");
}

// 길드장 → 별별 닉네임 일괄 마이그레이션
window.migrateGuildMasterNick = async function() {
  if (!confirm('"길드장" 닉네임으로 체크된 꽃을 전부 "별별"로 바꿀까요?')) return;
  const snap = await get(ref(db, "selections"));
  const data = snap.val() || {};
  let count = 0;
  const updates = {};
  for (const [flowerId, nicks] of Object.entries(data)) {
    if (nicks && nicks["길드장"]) {
      updates[`selections/${flowerId}/별별`] = true;
      updates[`selections/${flowerId}/길드장`] = null;
      count++;
    }
  }
  if (count === 0) { showToast("변경할 데이터가 없어요 (이미 완료됐거나 없음)"); return; }
  await update(ref(db), updates);
  showToast(`✅ ${count}개 꽃의 닉네임을 별별로 변경했어요`);
}

window.doBlock = function() {
  const nick = document.getElementById("block-input").value.trim();
  if (!nick) return;
  window.toggleBlock(nick);
  document.getElementById("block-input").value = "";
}
</script>
