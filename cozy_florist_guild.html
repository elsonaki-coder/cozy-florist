<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 코지 플로리스트 정원산책길드 소유꽃확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#4caf50;--green-light:#e8f5e9;--green-mid:#a5d6a7;
    --blue:#1976d2;--blue-light:#e3f2fd;--blue-mid:#90caf9;
    --purple:#6a1b9a;--purple-light:#f3e5f5;--purple-mid:#ce93d8;
    --yellow:#f57f17;--yellow-light:#fffde7;--yellow-mid:#fff176;
    --red:#b71c1c;--red-light:#fce4ec;--red-mid:#f48fb1;
    --bg:#faf9f7;--card:#fff;--border:#e8e4df;--border2:#d4cfc9;
    --text:#2c2825;--text2:#6b6560;--text3:#9e9890;
    --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  }
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  
  /* LOGIN */
  #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1.5rem;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1.2rem;align-items:center;}
  .login-emoji{font-size:48px;}
  .login-title{font-size:20px;font-weight:700;color:var(--text);}
  .login-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;}
  .login-input{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .2s;}
  .login-input:focus{border-color:var(--green);}
  .login-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;}
  .login-btn:hover{background:#388e3c;}
  .login-note{font-size:11px;color:var(--text3);text-align:center;line-height:1.6;}

  /* APP */
  #app-screen{display:none;flex-direction:column;min-height:100vh;}
  
  /* HEADER */
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
  .header-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.3;}
  .header-credit{font-size:10px;font-weight:400;color:var(--text3);margin-left:2px;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .nick-badge{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
  .logout-btn{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{color:var(--text);}

  /* TABS */
  .tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 1rem;}
  .tab{padding:12px 14px;font-size:14px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:all .15s;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  /* CONTENT */
  .content{flex:1;padding:1rem;}

  /* FILTERS */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}
  .search-wrap{position:relative;flex:1;min-width:140px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);}
  .search-input{width:100%;padding:9px 10px 9px 34px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .search-input:focus{border-color:var(--green);}
  .filter-select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;}
  .sort-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .sort-pill{padding:6px 11px;border-radius:20px;font-size:12px;font-family:inherit;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;}
  .sort-pill.active{background:var(--green-light);border-color:var(--green-mid);color:#2e7d32;font-weight:500;}

  /* FLOWER LIST */
  .flower-list{display:flex;flex-direction:column;gap:6px;}
  .flower-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
  .flower-row:active{transform:scale(.98);}
  .flower-row.selected{background:var(--green-light);border-color:var(--green-mid);}
  .grade-badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
  .grade-N{background:var(--green-light);color:#2e7d32;border:1px solid var(--green-mid);}
  .grade-R{background:var(--blue-light);color:#1565c0;border:1px solid var(--blue-mid);}
  .grade-SR{background:var(--purple-light);color:#4a148c;border:1px solid var(--purple-mid);}
  .grade-SSR{background:var(--yellow-light);color:#e65100;border:1px solid var(--yellow-mid);}
  .grade-UR{background:var(--red-light);color:#b71c1c;border:1px solid var(--red-mid);}
  .flower-name{font-size:14px;flex:1;color:var(--text);}
  .flower-cond{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
  .check-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .check-icon.on{background:var(--green);color:#fff;}
  .check-icon.off{background:var(--border);color:transparent;}

  /* GUILD VIEW */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
  .stat-num{font-size:22px;font-weight:700;color:var(--text);}
  .stat-num.warn{color:#e53935;}
  .stat-num.ok{color:#43a047;}
  .stat-label{font-size:11px;color:var(--text2);margin-top:2px;}
  .guild-row{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);}
  .guild-row.unowned{border-color:#ef9a9a;background:#fff8f8;}
  .guild-row-top{display:flex;align-items:center;gap:8px;}
  .unowned-badge{font-size:10px;background:var(--red-light);color:#c62828;border-radius:8px;padding:2px 7px;border:1px solid var(--red-mid);flex-shrink:0;}
  .owner-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .owner-chip{font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:2px 8px;color:var(--text2);}

  /* ADMIN */
  .admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .section-title{font-size:14px;font-weight:700;margin-bottom:1rem;color:var(--text);}
  .admin-input-row{display:flex;gap:8px;margin-bottom:1rem;}
  .admin-input{flex:1;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
  .admin-input:focus{border-color:var(--green);}
  .admin-btn{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .admin-btn:hover{background:var(--border);}
  .admin-btn.danger{border-color:#ef9a9a;color:#c62828;background:var(--red-light);}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:#fff;}
  .blocked-row{border-color:#ef9a9a;background:var(--red-light);}
  .member-name{flex:1;font-size:14px;}
  .member-count{font-size:12px;color:var(--text2);}
  .blocked-tag{font-size:11px;background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:2px 8px;}
  .unblock-btn{font-size:12px;color:#c62828;border:1px solid var(--red-mid);border-radius:8px;padding:3px 10px;cursor:pointer;background:transparent;font-family:inherit;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* EMPTY */
  .empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px;}

  /* LOADING */
  .loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--text2);font-size:14px;gap:8px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}

  /* SAVE BAR */
  .save-bar{background:var(--green-light);border-bottom:1px solid var(--green-mid);padding:6px 1rem;font-size:12px;color:#2e7d32;text-align:center;font-weight:500;}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .modal{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:1.2rem;color:var(--text);}
  .modal-field{display:flex;flex-direction:column;gap:5px;margin-bottom:.9rem;}
  .modal-label{font-size:12px;font-weight:500;color:var(--text2);}
  .modal-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100%;}
  .modal-input:focus{border-color:var(--green);}
  .modal-row{display:flex;gap:8px;margin-top:.4rem;}
  .modal-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;}
  .modal-btn.primary{background:var(--green);color:#fff;}
  .modal-btn.primary:hover{background:#388e3c;}
  .modal-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border2);}
  .modal-btn.secondary:hover{background:var(--border);}
  .modal-btn.danger-btn{background:var(--red-light);color:#c62828;border:1px solid var(--red-mid);}

  /* CUSTOM FLOWER BADGE */
  .custom-tag{font-size:10px;background:#fff8e1;color:#e65100;border:1px solid #ffcc02;border-radius:8px;padding:1px 6px;flex-shrink:0;}
  .flower-actions{display:flex;gap:4px;flex-shrink:0;}
  .flower-action-btn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .flower-action-btn:hover{background:var(--border);}
  .flower-action-btn.del{border-color:var(--red-mid);color:#c62828;background:var(--red-light);}

  /* ADD BUTTON */
  .add-flower-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;margin-bottom:1rem;}
  .add-flower-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light);}

  @media(max-width:400px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .flower-cond{display:none;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-emoji">🌸</div>
    <div class="login-title">코지 플로리스트 길드</div>
    <div class="login-sub">꽃 보유 현황을 함께 관리해요</div>
    <input class="login-input" id="nick-input" placeholder="게임 닉네임 입력" maxlength="20" />
    <button class="login-btn" onclick="doLogin()">입장하기</button>
    <div class="login-note"><strong>정원산책_길드원</strong>만 이용 가능합니다<br></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="header">
    <div class="header-title">🌸 <span>코지 플로리스트 정원산책길드 소유꽃확인<span class="header-credit">ㅣ제작_별별_배포금지</span></span></div>
    <div class="header-right">
      <span class="nick-badge" id="header-nick"></span>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchTab('my')">내 꽃 관리</button>
    <button class="tab" onclick="switchTab('guild')">길드 현황</button>
    <button class="tab" id="admin-tab" style="display:none" onclick="switchTab('admin')">관리자 ⚙️</button>
  </div>
  <div id="save-bar" class="save-bar" style="display:none">저장 중...</div>
  <div class="content" id="content"></div>
</div>

<!-- FLOWER MODAL -->
<div class="modal-backdrop" id="flower-modal" style="display:none" onclick="closeFlowerModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">🌸 꽃 추가</div>
    <div class="modal-field">
      <div class="modal-label">등급</div>
      <select class="modal-input" id="modal-grade">
        <option value="N">N (초록)</option>
        <option value="R">R (파랑)</option>
        <option value="SR">SR (보라)</option>
        <option value="SSR">SSR (노랑)</option>
        <option value="UR">UR (빨강)</option>
      </select>
    </div>
    <div class="modal-field">
      <div class="modal-label">얻는 방법</div>
      <input class="modal-input" id="modal-cond" placeholder="예: 꽃시장 교환, 레벨 61 …" maxlength="30">
    </div>
    <div class="modal-field">
      <div class="modal-label">꽃 이름</div>
      <input class="modal-input" id="modal-name" placeholder="예: 연분홍 장미" maxlength="30">
    </div>
    <div class="modal-row">
      <button class="modal-btn secondary" onclick="closeFlowerModal()">취소</button>
      <button class="modal-btn primary" id="modal-submit-btn" onclick="submitFlower()">추가하기</button>
    </div>
    <div id="modal-delete-row" style="display:none;margin-top:8px;">
      <button class="modal-btn danger-btn" style="width:100%" onclick="deleteCustomFlower()">🗑 이 꽃 삭제하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function sortKey(name) {
  const parts = name.split(" ");
  return parts[parts.length - 1] + "|" + name;
}

// ── Firebase 구독 ──────────────────────────────────────────
function subscribeDB() {
  if (unsub) unsub();
  const r = ref(db, "/");
  unsub = onValue(r, snap => {
    const data = snap.val() || {};
    selections = data.selections || {};
    blocked = data.blocked || [];
    members = data.members || {};
    // 커스텀 꽃 로드 (fbKey를 id 대신 사용, id는 "c_"+fbKey로 구분)
    const raw = data.customFlowers || {};
    customFlowers = Object.entries(raw).map(([fbKey, v]) => {
      const safeId = ("c_" + fbKey).replace(/[.#$\/\[\]]/g,"_");
      return {
        fbKey,
        id: safeId,   // safeId를 id로 직접 사용 → selections 키와 일치
        grade: v.grade,
        cond: v.cond,
        name: v.name,
        addedBy: v.addedBy || "",
      };
    });
    // 내 꽃 세트 갱신 — 모든 키를 safeId 문자열 기준으로 통일
    const safeNick = nickname.replace(/[.#$\/\[\]]/g,"_");
    myFlowerSet = new Set(
      Object.entries(selections)
        .filter(([, nicks]) => nicks && nicks[safeNick])
        .map(([key]) => key)  // Firebase 키 그대로 (이미 safe)
    );
    renderContent();
  });
}

window.doLogin = async function() {
  const nick = document.getElementById("nick-input").value.trim();
  if (!nick) { showToast("닉네임을 입력해주세요"); return; }

  // 차단 확인
  const snap = await get(ref(db, "blocked"));
  const bl = snap.val() || [];
  if (bl.includes(nick)) { showToast("길드장에 의해 사용이 제한된 계정입니다."); return; }

  nickname = nick;
  // 멤버 등록
  await set(ref(db, `members/${nick.replace(/[.#$\/\[\]]/g,"_")}`), true);

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "flex";
  document.getElementById("header-nick").textContent = nick;
  if (nick === "길드장") document.getElementById("admin-tab").style.display = "flex";

  subscribeDB();
}

window.doLogout = function() {
  if (unsub) unsub();
  nickname = "";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("nick-input").value = "";
  document.getElementById("admin-tab").style.display = "none";
}

document.getElementById("nick-input").addEventListener("keydown", e => {
  if (e.key === "Enter") window.doLogin();
});

// ── 탭 ────────────────────────────────────────────────────
window.switchTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((el,i) => {
    const tabs = ["my","guild","admin"];
    el.classList.toggle("active", tabs[i] === tab || (i===2 && tab==="admin"));
  });
  // fix active for tab buttons
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  const tabEls = document.querySelectorAll(".tab");
  if(tab==="my") tabEls[0].classList.add("active");
  else if(tab==="guild") tabEls[1].classList.add("active");
  else if(tab==="admin") tabEls[2].classList.add("active");
  renderContent();
}

// ── 관리자: 차단 토글 ─────────────────────────────────────
window.toggleBlock = async function(nick) {
  const bl = [...blocked];
  const idx = bl.indexOf(nick);
  if (idx >= 0) bl.splice(idx,1); else bl.push(nick);
  await set(ref(db,"blocked"), bl);
  showToast(idx >= 0 ? `${nick} 차단 해제됨` : `${nick} 차단됨`);
}

// ── 관리자: 멤버 삭제 ─────────────────────────────────────
window.deleteMember = async function(nick) {
  const ok = confirm(`${nick} 계정을 삭제할까요?`);
  if (!ok) return;
  const safeNick = nick.replace(/[.#$\/\[\]]/g,"_");
  await remove(ref(db, `members/${safeNick}`));
  for (const flowerId in selections) {
    if (selections[flowerId] && selections[flowerId][safeNick]) {
      await remove(ref(db, `selections/${flowerId}/${safeNick}`));
    }
  }
  showToast(`${nick} 삭제 완료`);
}

  // safeId: data-fid 에서 온 문자열 (이미 safe 처리됨)

  const safeNick = nickname.replace(/[.#$\/\[\]]/g,"_");

function getFiltered() {
  let list = allFlowers();
  if (filterGrade !== "전체") list = list.filter(f => f.grade === filterGrade);
  if (filterCond !== "전체") list = list.filter(f => f.cond === filterCond);
  if (searchText) {
    const q = searchText.toLowerCase();
    list = list.filter(f => {
      const core = f.name.split(" ").slice(-1)[0];
      return f.name.toLowerCase().includes(q) || core.toLowerCase().includes(q);
    });
  }
  list.sort((a,b) => {
    let result = 0;
    if (sortBy === "grade") {
      result = (GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade]) || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else if (sortBy === "cond") {
      result = a.cond.localeCompare(b.cond, "ko") || sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    } else {
      result = sortKey(a.name).localeCompare(sortKey(b.name), "ko");
    }
    if (sortBy !== "cond" && sortReverse) result *= -1;
    return result;
  });
  return list;
}

        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search-input" placeholder="꽃 이름 검색 (예: 백합)" value="${searchText}">
      </div>
      <select class="filter-select" id="grade-filter">
        ${["전체","N","R","SR","SSR","UR"].map(g=>`<option${filterGrade===g?" selected":""}>${g}</option>`).join("")}
      </select>
      <select class="filter-select" id="cond-filter">
        ${getAllConds().map(c=>`<option${filterCond===c?" selected":""}>${c}</option>`).join("")}
      </select>
      <div class="sort-pills">
        ${[["name","이름순"],["grade","등급순"],["cond","조건순"]].map(([v,l])=>`<button class="sort-pill${sortBy===v?" active":""}" onclick="setSortBy('${v}')">${l}</button>`).join("")}
      <button class="sort-pill ${sortReverse ? "active" : ""}"
onclick="toggleReverseSort()">
↕ 역순
</button>
      </div>
    </div>
    <button class="add-flower-btn" onclick="openAddFlowerModal()">＋ 새 꽃 추가하기</button>
    <div class="flower-list" id="flower-list">
      ${list.map(f => {
        const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
        const sel = myFlowerSet.has(safeId);
        const isCustom = typeof f.id === "string" && f.id.startsWith("c_");
        return `<div class="flower-row${sel?" selected":""}" data-fid="${safeId}">
          <span class="grade-badge grade-${f.grade}">${f.grade}</span>
          <span class="flower-name">${f.name}</span>
          ${isCustom ? `<span class="custom-tag">추가됨</span>` : ""}
          <span class="flower-cond">${f.cond}</span>
          ${isCustom ? `<span class="flower-actions"><button class="flower-action-btn edit-btn" data-fbkey="${f.fbKey}" title="수정">✏️</button></span>` : ""}
          <span class="check-icon ${sel?"on":"off"}">${sel?"✓":""}</span>
        </div>`;
      }).join("")}
      ${list.length===0?'<div class="empty">검색 결과가 없어요</div>':""}
    </div>
  `;
  // 꽃 클릭 이벤트 — data-fid로 안전하게 id 전달
  document.getElementById("flower-list").addEventListener("click", e => {
    const editBtn = e.target.closest(".edit-btn");
    if (editBtn) { openEditFlowerModal(editBtn.dataset.fbkey); return; }
    const row = e.target.closest(".flower-row");
    if (row) toggleFlower(row.dataset.fid);
  });
  document.getElementById("search-input").addEventListener("compositionstart", () => { composing = true; });
  document.getElementById("search-input").addEventListener("compositionend", e => { composing = false; searchText = e.target.value; renderMy(); });
  document.getElementById("search-input").addEventListener("input", e => { if (!composing) { searchText = e.target.value; renderMy(); } });
  document.getElementById("grade-filter").addEventListener("change", e => { filterGrade=e.target.value; renderMy(); });
  document.getElementById("cond-filter").addEventListener("change", e => { filterCond=e.target.value; renderMy(); });
  if (searchText) {
    const inp = document.getElementById("search-input");
    inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
  }
}

window.setSortBy = function(v) { sortBy=v; renderMy(); }
window.toggleReverseSort = function() {
  sortReverse = !sortReverse;
  renderMy();
}
function renderGuild() {
  const flowers = allFlowers();
  const totalOwned = flowers.filter(f => {
    const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
    const n = selections[safeId];
    return n && Object.keys(n).length > 0;
  }).length;
  const totalUnowned = flowers.length - totalOwned;
  const memberCount = Object.keys(members).length;

  // 필터링
  let list = [...flowers];
  if (guildView === "unowned") list = list.filter(f => {
    const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
    const n = selections[safeId]; return !n || Object.keys(n).length===0;
  });
  if (guildFilterGrade !== "전체") list = list.filter(f => f.grade === guildFilterGrade);
  if (guildFilterCond !== "전체") list = list.filter(f => f.cond === guildFilterCond);
  if (guildSearch) {
    const q = guildSearch.toLowerCase();
    if (guildSortBy === "member") {
      list = list.filter(f => {
        const nicks = selections[f.id] ? Object.keys(selections[f.id]) : [];
        return nicks.some(n => n.toLowerCase().includes(q));
      });
    } else {
      list = list.filter(f => {
        const core = f.name.split(" ").slice(-1)[0];
        return f.name.toLowerCase().includes(q) || core.toLowerCase().includes(q);
      });
    }
  }
  // 정렬
list.sort((a,b) => {

  let result = 0;

  if (guildSortBy === "grade") {
    result =
      (GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade]) ||
      sortKey(a.name).localeCompare(sortKey(b.name), "ko");
  }

  else if (guildSortBy === "cond") {
    result =
      a.cond.localeCompare(b.cond, "ko") ||
      sortKey(a.name).localeCompare(sortKey(b.name), "ko");
  }

  else if (guildSortBy === "member") {

    const ca = selections[a.id]
      ? Object.keys(selections[a.id]).length
      : 0;

    const cb = selections[b.id]
      ? Object.keys(selections[b.id]).length
      : 0;

    result =
      cb - ca ||
      sortKey(a.name).localeCompare(sortKey(b.name), "ko");
  }

  else {
    result =
      sortKey(a.name).localeCompare(sortKey(b.name), "ko");
  }

  // 조건순 제외
  if (guildSortBy !== "cond" && guildSortReverse) {
    result *= -1;
  }

  return result;
});

  document.getElementById("content").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${flowers.length}</div><div class="stat-label">전체 꽃</div></div>
      <div class="stat-card"><div class="stat-num ok">${totalOwned}</div><div class="stat-label">보유됨</div></div>
      <div class="stat-card"><div class="stat-num ${totalUnowned>0?"warn":"ok"}">${totalUnowned}</div><div class="stat-label">미보유</div></div>
      <div class="stat-card"><div class="stat-num">${memberCount}</div><div class="stat-label">길드원</div></div>
    </div>
    <div class="filters">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="guild-search-input" placeholder="${guildSortBy==="member"?"길드원 닉네임 검색":"꽃 이름 검색 (예: 백합)"}" value="${guildSearch}">
      </div>
      <select class="filter-select" id="guild-grade-filter">
        ${["전체","N","R","SR","SSR","UR"].map(g=>`<option${guildFilterGrade===g?" selected":""}>${g}</option>`).join("")}
      </select>
      <select class="filter-select" id="guild-cond-filter">
        ${getAllConds().map(c=>`<option${guildFilterCond===c?" selected":""}>${c}</option>`).join("")}
      </select>
    </div>
    <div class="sort-pills" style="margin-bottom:.75rem">
      ${[["name","이름순"],["grade","등급순"],["cond","조건순"],["member","길드원순"]].map(([v,l])=>`<button class="sort-pill${guildSortBy===v?" active":""}" onclick="setGuildSort('${v}')">${l}</button>`).join("")}

 <button class="sort-pill ${guildSortReverse ? "active" : ""}"
onclick="toggleGuildReverseSort()">
↕ 역순
</button>

    </div>
    <div class="sort-pills" style="margin-bottom:1rem">
      <button class="sort-pill${guildView==="all"?" active":""}" onclick="setGuildView('all')">전체 보기</button>
      <button class="sort-pill${guildView==="unowned"?" active":""}" onclick="setGuildView('unowned')">⚠️ 미보유만</button>
    </div>
    <div class="flower-list">
      ${list.map(f => {
        const safeId = String(f.id).replace(/[.#$\/\[\]]/g,"_");
        const rawNicks = selections[safeId] ? Object.keys(selections[safeId]) : [];
        // safeNick -> 원본 닉네임 복원은 어려우므로 members 키와 매핑
        const nicks = rawNicks;
        const has = nicks.length > 0;
        const isCustom = typeof f.id === "string" && f.id.startsWith("c_");
        return `<div class="guild-row${has?"":" unowned"}">
          <div class="guild-row-top">
            <span class="grade-badge grade-${f.grade}">${f.grade}</span>
            <span class="flower-name">${f.name}</span>
            ${isCustom ? '<span class="custom-tag">추가됨</span>' : ""}
            ${!has?'<span class="unowned-badge">미보유</span>':""}
          </div>
          ${has?`<div class="owner-chips">${nicks.map(n=>`<span class="owner-chip">${n}</span>`).join("")}</div>`:""}
        </div>`;
      }).join("")}
      ${list.length===0?'<div class="empty">검색 결과가 없거나 모든 꽃이 보유되어 있어요 🎉</div>':""}
    </div>
  `;

  // 이벤트
  let gComposing = false;
  const gi = document.getElementById("guild-search-input");
  gi.addEventListener("compositionstart", () => { gComposing = true; });
  gi.addEventListener("compositionend", e => { gComposing = false; guildSearch = e.target.value; renderGuild(); });
  gi.addEventListener("input", e => { if (!gComposing) { guildSearch = e.target.value; renderGuild(); } });
  document.getElementById("guild-grade-filter").addEventListener("change", e => { guildFilterGrade=e.target.value; renderGuild(); });
  document.getElementById("guild-cond-filter").addEventListener("change", e => { guildFilterCond=e.target.value; renderGuild(); });
  if (guildSearch) { gi.focus(); gi.setSelectionRange(gi.value.length,gi.value.length); }
}

window.setGuildView = function(v) { guildView=v; renderGuild(); }
window.setGuildSort = function(v) { guildSortBy=v; guildSearch=""; renderGuild(); }
window.toggleGuildReverseSort = function() {
  guildSortReverse = !guildSortReverse;
  renderGuild();
}
function renderAdmin() {
  const memberList = Object.keys(members);
  document.getElementById("content").innerHTML = `
    <div class="admin-section">
      <div class="section-title">길드원 차단 관리</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:.75rem;line-height:1.6">차단된 닉네임은 프로그램 접속이 불가합니다.</div>
      <div class="admin-input-row">
        <input class="admin-input" id="block-input" placeholder="차단할 닉네임 입력">
        <button class="admin-btn" onclick="doBlock()">차단/해제</button>
      </div>
      ${blocked.length>0?`
        <div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px">차단 목록 (${blocked.length}명)</div>
        ${blocked.map(n=>`<div class="member-row blocked-row">
          <span class="member-name" style="color:#c62828">${n}</span>
          <button class="unblock-btn" onclick="toggleBlock('${n}')">해제</button>
        </div>`).join("")}
      `:`<div style="font-size:13px;color:var(--text3)">차단된 길드원이 없습니다.</div>`}
    </div>
    <div class="admin-section">
      <div class="section-title">길드원 목록 (${memberList.length}명)</div>
      ${memberList.map(n=>`<div class="member-row">
        <span class="member-name">${n}</span>
        ${blocked.includes(n)?'<span class="blocked-tag">차단됨</span>':""}
        <span class="member-count">꽃 ${Object.keys(selections).filter(id=>selections[id]&&selections[id][n.replace(/[.#$\/\[\]]/g,"_")]).length}개</span>

  <button class="unblock-btn"
onclick="deleteMember('${n}')"
style="margin-left:6px">
삭제
</button>

      </div>`).join("")}
      ${memberList.length===0?'<div style="font-size:13px;color:var(--text3)">아직 접속한 길드원이 없습니다.</div>':""}
    </div>
  `;
  document.getElementById("block-input").addEventListener("keydown", e => { if(e.key==="Enter") window.doBlock(); });
}

window.doBlock = function() {
  const nick = document.getElementById("block-input").value.trim();
  if (!nick) return;
  window.toggleBlock(nick);
  document.getElementById("block-input").value = "";
}
</script>
